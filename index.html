<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домик в деревне</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        /* --- ПЕРЕМЕННЫЕ ДЛЯ ТЕМ --- */
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --primary: #bb86fc;
            --primary-hover: #9965d6;
            --success: #03dac6;
            --danger: #cf6679;
            --border: #333;
        }

        body.light-theme {
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666;
            --primary: #6200ee;
            --primary-hover: #3700b3;
            --success: #018786;
            --danger: #b00020;
            --border: #ddd;
        }

        /* --- БАЗОВЫЕ СТИЛИ --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 15px; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            transition: background 0.3s, color 0.3s;
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0; color: var(--primary); }
        
        .header-btns { display: flex; gap: 10px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;}
        
        /* Календарь */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
        .day { 
            padding: 12px 0; 
            background: var(--card-bg); 
            border-radius: 8px; 
            text-align: center; 
            font-size: 14px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .day.booked { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: bold; }
        .day.paid { background: var(--success); color: #000; border-color: var(--success); font-weight: bold; }
        
        /* Формы и карточки */
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 12px; }
        input { 
            padding: 12px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--bg); 
            color: var(--text);
            font-size: 16px;
        }
        button[type="submit"] { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: bold; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px;}
        button[type="submit"]:hover { background: var(--primary-hover); }

        /* Список записей */
        .booking-item { 
            background: var(--card-bg); 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border);
        }
        .actions { display: flex; gap: 8px; }
        .action-btn { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none;}
        .action-btn.del { background: var(--danger); }
        
        /* Лендинг для гостей */
        .guest-hero { text-align: center; margin-bottom: 30px; }
        .guest-hero img { width: 100%; border-radius: 12px; max-height: 250px; object-fit: cover; margin-bottom: 15px;}
        .guest-hero p { color: var(--text-muted); font-size: 16px; }
        
        .main-btn { 
            display: block; 
            text-align: center; 
            background: var(--primary); 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 18px; 
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.3);
        }

        /* Утилиты */
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <h1>Домик в деревне</h1>
        <div class="header-btns">
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="icon-btn" onclick="toggleAdmin()">👤</button>
        </div>
    </header>

    <!-- ИНТЕРФЕЙС ГОСТЯ -->
    <div id="guestView">
        <div class="guest-hero">
            <img src="https://images.unsplash.com/photo-1510798831971-661eb04b3739?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Домик">
            <p>Уютный гостевой дом с баней и купелью. Забронируйте свободные даты прямо сейчас.</p>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Занятость на месяц</h3>
            <div class="calendar" id="calendarGuest"></div>
            <div style="display: flex; gap: 15px; font-size: 12px; color: var(--text-muted); justify-content: center;">
                <span><span style="display:inline-block;width:10px;height:10px;background:var(--card-bg);border:1px solid var(--border);border-radius:2px;"></span> Свободно</span>
                <span><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px;"></span> Занято</span>
            </div>
        </div>

        <a href="#" class="main-btn">Забронировать в Max</a>
        <a href="tel:+79000000000" class="main-btn" style="background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none;">Позвонить</a>
    </div>

    <!-- ИНТЕРФЕЙС АДМИНА -->
    <div id="adminView" class="hidden">
        <div class="flex-between" style="margin-bottom: 15px;">
            <h2 style="margin: 0; font-size: 18px; color: var(--text);">Панель управления</h2>
            <button class="action-btn del" onclick="logoutAdmin()">Выйти</button>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Добавить запись</h3>
            <form id="bookingForm">
                <div class="form-group"><input type="text" id="guestName" placeholder="Имя гостя" required></div>
                <div class="form-group"><input type="tel" id="phone" placeholder="Телефон" required></div>
                <div class="form-group"><input type="date" id="date" required></div>
                <div class="form-group"><input type="number" id="totalPrice" placeholder="Сумма (₽)" required></div>
                <div class="form-group"><input type="number" id="prepayment" placeholder="Предоплата (₽)"></div>
                <button type="submit">Сохранить</button>
            </form>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Календарь</h3>
            <div class="calendar" id="calendarAdmin"></div>
        </div>

        <h3>Все записи</h3>
        <div id="bookingList"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCEWN8qG6hsO_JgnFzUpEPRDAsEGVf-wkw",
        authDomain: "domik-v-derevne.firebaseapp.com",
        projectId: "domik-v-derevne",
        storageBucket: "domik-v-derevne.firebasestorage.app",
        messagingSenderId: "119021071606",
        appId: "1:119021071606:web:d220c26fe1c4abf7c250d7"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.firebaseFns = { collection, addDoc, deleteDoc, doc, onSnapshot };
    </script>

    <script>
        // --- ТЕМА ---
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
        }
        // Восстановление темы
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        // --- АВТОРИЗАЦИЯ ---
        let isAdmin = false;
        function toggleAdmin() {
            if (isAdmin) {
                logoutAdmin();
                return;
            }
            const pin = prompt("Введите пин-код администратора:");
            if (pin === '1234') { // <--- СМЕНИТЬ ПАРОЛЬ ЗДЕСЬ
                isAdmin = true;
                document.getElementById('guestView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                // Принудительно обновляем календарь
                if(window.renderAdminCalendar) window.renderAdminCalendar();
            } else if (pin !== null) {
                alert("Неверный пин-код");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('guestView').classList.remove('hidden');
        }

        // --- ЛОГИКА FIREBASE ---
        window.addEventListener('load', () => {
            const db = window.db;
            const { collection, addDoc, deleteDoc, doc, onSnapshot } = window.firebaseFns;
            const bookingsCollection = collection(db, "bookings");
            let bookings = [];

            onSnapshot(bookingsCollection, (snapshot) => {
                bookings = [];
                snapshot.forEach((doc) => {
                    bookings.push({ id: doc.id, ...doc.data() });
                });
                
                // Отрисовываем календарь для гостя
                renderCalendar('calendarGuest', bookings, false);
                // Отрисовываем календарь для админа (с суммами)
                renderCalendar('calendarAdmin', bookings, true);
                // Отрисовываем список (только для админа)
                renderList(bookings);
            });

            function renderCalendar(elementId, data, isAdminView) {
                const calendar = document.getElementById(elementId);
                if(!calendar) return;
                calendar.innerHTML = '';
                
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                daysOfWeek.forEach(d => {
                    const div = document.createElement('div');
                    div.textContent = d;
                    div.style.fontWeight = 'bold'; div.style.textAlign = 'center'; div.style.fontSize = '12px'; div.style.color = 'var(--text-muted)';
                    calendar.appendChild(div);
                });

                const firstDay = new Date(year, month, 1).getDay();
                const offset = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = 0; i < offset; i++) {
                    const div = document.createElement('div');
                    calendar.appendChild(div);
                }

                for (let i = 1; i <= daysInMonth; i++) {
                    const div = document.createElement('div');
                    div.classList.add('day');
                    div.textContent = i;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    const dayBookings = data.filter(b => b.date === dateStr);
                    
                    if (dayBookings.length > 0) {
                        // Если админ смотрит - помечаем, что занято (красным, если не оплачено, зеленым, если оплачено)
                        const isFullyPaid = dayBookings.every(b => Number(b.prepayment) >= Number(b.totalPrice));
                        div.classList.add(isFullyPaid ? 'paid' : 'booked');
                        
                        // В админке при клике на день можем вывести инфу
                        if (isAdminView) {
                            div.onclick = () => alert(`Гость: ${dayBookings[0].guestName}\nТел: ${dayBookings[0].phone}\nСумма: ${dayBookings[0].totalPrice}₽`);
                        }
                    }
                    calendar.appendChild(div);
                }
            }

            // Отдельная функция для отрисовки списка в админке
            function renderList(data) {
                const list = document.getElementById('bookingList');
                if(!list) return;
                list.innerHTML = '';
                data.sort((a, b) => a.date.localeCompare(b.date));
                
                data.forEach((b) => {
                    const div = document.createElement('div');
                    div.className = 'booking-item';
                    const cleanPhone = b.phone.replace(/[^0-9]/g, '');
                    div.innerHTML = `
                        <div>
                            <strong>${b.date}</strong> — ${b.guestName} <br>
                            <small style="color:var(--text-muted)">${b.totalPrice}₽ (аванс: ${b.prepayment}₽)</small>
                        </div>
                        <div class="actions">
                            <a href="tel:${b.phone}" class="action-btn">📞</a>
                            <button class="action-btn del" onclick="deleteBooking('${b.id}')">X</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            document.getElementById('bookingForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newBooking = {
                    guestName: document.getElementById('guestName').value,
                    phone: document.getElementById('phone').value,
                    date: document.getElementById('date').value,
                    totalPrice: document.getElementById('totalPrice').value,
                    prepayment: document.getElementById('prepayment').value || 0
                };
                try {
                    await addDoc(bookingsCollection, newBooking);
                    e.target.reset();
                } catch (error) { alert('Ошибка: ' + error.message); }
            });

            window.deleteBooking = async function(id) {
                if (confirm('Удалить запись?')) {
                    try { await deleteDoc(doc(db, "bookings", id)); } catch (error) { console.error(error); }
                }
            };
        });
    </script>
</body>
</html>
