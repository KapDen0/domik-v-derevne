<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование - Домик в деревне</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --text-muted: #888;
            --primary: #bb86fc; --primary-hover: #9965d6; --success: #03dac6;
            --danger: #cf6679; --border: #333; --input-bg: #2a2a2a;
        }
        body.light-theme {
            --bg: #f4f4f9; --card-bg: #ffffff; --text: #1a1a1a; --text-muted: #666;
            --primary: #6200ee; --primary-hover: #3700b3; --success: #018786;
            --danger: #b00020; --border: #ddd; --input-bg: #f9f9f9;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0; color: var(--primary); }
        
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px;}
        
        /* Календарь */
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 15px; }
        .day { padding: 10px 0; background: var(--card-bg); border-radius: 6px; text-align: center; font-size: 14px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .day.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .day.booked, .day.blocked { background: var(--danger); color: #fff; border-color: var(--danger); cursor: not-allowed; opacity: 0.7;}
        
        /* Формы */
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted); }
        input, select { padding: 12px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        button[type="submit"] { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: bold; padding: 15px; border-radius: 8px; width: 100%; font-size: 16px; margin-top: 10px;}
        button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .total-price { font-size: 24px; font-weight: bold; text-align: center; margin: 15px 0; color: var(--success); }
        
        /* Админка */
        .admin-section { border: 2px dashed var(--border); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .admin-title { color: var(--danger); font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        
        .booking-item { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid var(--primary); position: relative;}
        .booking-item.blocked-item { border-left-color: var(--danger); opacity: 0.8;}
        .del-btn { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; position: absolute; top: 10px; right: 10px; font-size: 12px;}
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Домик в деревне</h1>
        <div>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="icon-btn" onclick="toggleAdmin()">👤</button>
        </div>
    </header>

    <!-- ================= ИНТЕРФЕЙС ГОСТЯ ================= -->
    <div id="guestView">
        <div class="card">
            <h3 style="margin-top:0">Выберите даты</h3>
            <div class="calendar" id="calendarGuest"></div>
            
            <div class="row">
                <div class="form-group">
                    <label>Заезд (после 14:00)</label>
                    <input type="date" id="g_checkIn">
                </div>
                <div class="form-group">
                    <label>Выезд (до 12:00)</label>
                    <input type="date" id="g_checkOut">
                </div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label>Взрослые</label>
                    <input type="number" id="g_adults" value="2" min="1">
                </div>
                <div class="form-group">
                    <label>Дети</label>
                    <input type="number" id="g_children" value="0" min="0">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0">Дополнительно</h3>
            <div class="row">
                <div class="form-group">
                    <label>Баня (часов)</label>
                    <input type="number" id="g_banya" value="0" min="0" max="12" onchange="updatePrice()">
                </div>
                <div class="form-group">
                    <label>Купель (часов)</label>
                    <input type="number" id="g_kupel" value="0" min="0" max="12" onchange="updatePrice()">
                </div>
            </div>
        </div>

        <div class="total-price" id="g_total_price">Итого: 0 ₽</div>
        
        <button type="submit" id="g_book_btn" onclick="openBookingForm()">Забронировать</button>

        <!-- Скрытая форма бронирования (появляется при нажатии) -->
        <div class="card hidden" id="bookingFormCard" style="margin-top: 20px; border: 2px solid var(--primary);">
            <h3 style="margin-top:0">Ваши данные</h3>
            <div class="form-group"><label>Имя</label><input type="text" id="g_name" placeholder="Иван"></div>
            <div class="form-group"><label>Телефон</label><input type="tel" id="g_phone" placeholder="+7 900 000-00-00"></div>
            <button type="submit" onclick="submitBooking()">Подтвердить заказ</button>
        </div>
    </div>

    <!-- ================= ИНТЕРФЕЙС АДМИНА ================= -->
    <div id="adminView" class="hidden">
        <h2 style="color: var(--danger);">Панель управления</h2>
        
        <div class="admin-section">
            <div class="admin-title">⚙️ Настройки цен (в сутки / в час)</div>
            <div class="row">
                <div class="form-group"><label>Домик (сутки)</label><input type="number" id="s_domik" value="5000" onchange="saveSettings()"></div>
                <div class="form-group"><label>Баня (час)</label><input type="number" id="s_banya" value="1000" onchange="saveSettings()"></div>
                <div class="form-group"><label>Купель (час)</label><input type="number" id="s_kupel" value="500" onchange="saveSettings()"></div>
            </div>
        </div>

        <div class="admin-section" style="border-color: var(--danger);">
            <div class="admin-title">🚫 Блокировка даты (уборка/отдых)</div>
            <div class="row">
                <div class="form-group"><input type="date" id="block_date"></div>
                <div class="form-group"><button onclick="blockDate()" style="background:var(--danger); color:white; border:none; border-radius:8px; padding:12px; width:100%; font-weight:bold;">Заблокировать</button></div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-top:0">Календарь</h3>
            <div class="calendar" id="calendarAdmin"></div>
        </div>

        <h3>Брони и блокировки</h3>
        <div id="bookingList"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = { apiKey: "AIzaSyCEWN8qG6hsO_JgnFzUpEPRDAsEGVf-wkw", authDomain: "domik-v-derevne.firebaseapp.com", projectId: "domik-v-derevne", storageBucket: "domik-v-derevne.firebasestorage.app", messagingSenderId: "119021071606", appId: "1:119021071606:web:d220c26fe1c4abf7c250d7" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.firebaseFns = { collection, addDoc, deleteDoc, doc, onSnapshot };
    </script>

    <script>
        // --- ТЕМА ---
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme'); document.getElementById('themeBtn').textContent = '☀️';
        }

        // --- АДМИНКА ---
        let isAdmin = false;
        function toggleAdmin() {
            if (isAdmin) { logoutAdmin(); return; }
            const pin = prompt("Пароль админа:");
            if (pin === '1234') {
                isAdmin = true;
                document.getElementById('guestView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
                loadSettings();
                if (window.forceRender) window.forceRender();
            } else if (pin !== null) { alert("Неверный пароль"); }
        }
        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('guestView').classList.remove('hidden');
            document.getElementById('bookingFormCard').classList.add('hidden');
        }

        // --- ГЛОБАЛЬНЫЕ ДАННЫЕ ---
        let allBookings = [];
        let prices = { domik: 5000, banya: 1000, kupel: 500 };

        // Настройки цен (сохраняются в браузере мамы)
        function saveSettings() {
            prices.domik = Number(document.getElementById('s_domik').value) || 0;
            prices.banya = Number(document.getElementById('s_banya').value) || 0;
            prices.kupel = Number(document.getElementById('s_kupel').value) || 0;
            localStorage.setItem('prices', JSON.stringify(prices));
            updatePrice(); // обновляем цену у гостя
            renderCalendar('calendarAdmin', true); // обновляем инфу
        }
        function loadSettings() {
            const saved = localStorage.getItem('prices');
            if(saved) prices = JSON.parse(saved);
            document.getElementById('s_domik').value = prices.domik;
            document.getElementById('s_banya').value = prices.banya;
            document.getElementById('s_kupel').value = prices.kupel;
        }

        // --- ЛОГИКА FIREBASE ---
        window.addEventListener('load', () => {
            const db = window.db;
            const { collection, addDoc, deleteDoc, doc, onSnapshot } = window.firebaseFns;
            const bookingsCollection = collection(db, "bookings");

            onSnapshot(bookingsCollection, (snapshot) => {
                allBookings = [];
                snapshot.forEach((doc) => { allBookings.push({ id: doc.id, ...doc.data() }); });
                
                renderCalendar('calendarGuest', false);
                renderCalendar('calendarAdmin', true);
                renderList();
                updatePrice();
            });
            window.forceRender = () => { renderCalendar('calendarAdmin', true); renderList(); };

            // --- ОТРИСОВКА КАЛЕНДАРЯ ---
            function renderCalendar(elementId, isAdminView) {
                const calendar = document.getElementById(elementId);
                if(!calendar) return;
                calendar.innerHTML = '';
                const now = new Date();
                const year = now.getFullYear(), month = now.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
                daysOfWeek.forEach(d => {
                    const div = document.createElement('div');
                    div.textContent = d; div.style.textAlign = 'center'; div.style.fontSize = '12px'; div.style.color = 'var(--text-muted)';
                    calendar.appendChild(div);
                });

                const firstDay = new Date(year, month, 1).getDay();
                const offset = firstDay === 0 ? 6 : firstDay - 1;
                for (let i = 0; i < offset; i++) calendar.appendChild(document.createElement('div'));

                for (let i = 1; i <= daysInMonth; i++) {
                    const div = document.createElement('div');
                    div.classList.add('day'); div.textContent = i;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    
                    // Проверяем занятость
                    const dayBooking = allBookings.find(b => b.date === dateStr || b.blocked);
                    if (dayBooking) {
                        div.classList.add(dayBooking.blocked ? 'blocked' : 'booked');
                    }
                    calendar.appendChild(div);
                }
            }

            // --- ОТРИСОВКА СПИСКА (АДМИН) ---
            function renderList() {
                const list = document.getElementById('bookingList');
                if(!list) return;
                list.innerHTML = '';
                
                allBookings.sort((a, b) => a.date.localeCompare(b.date));
                
                allBookings.forEach((b) => {
                    const div = document.createElement('div');
                    div.className = 'booking-item' + (b.blocked ? ' blocked-item' : '');
                    
                    let content = '';
                    if (b.blocked) {
                        content = `<strong>${b.date}</strong> — 🚫 ЗАБЛОКИРОВАНО`;
                    } else {
                        content = `<strong>${b.date}</strong> — ${b.name} <br>
                                   <small>👥 ${b.adults} взр. ${b.children > 0 ? ', ' + b.children + ' дет.' : ''}</small><br>
                                   <small>Допы: Баня ${b.banya}ч, Купель ${b.kupel}ч</small><br>
                                   <strong>Сумма: ${b.total}₽</strong>`;
                    }

                    div.innerHTML = `
                        ${content}
                        <button class="del-btn" onclick="deleteBooking('${b.id}')">X</button>
                    `;
                    list.appendChild(div);
                });
            }

            // --- РАСЧЕТ ЦЕНЫ (ГОСТЬ) ---
            window.updatePrice = function() {
                const inDate = document.getElementById('g_checkIn').value;
                const outDate = document.getElementById('g_checkOut').value;
                const banya = Number(document.getElementById('g_banya').value) || 0;
                const kupel = Number(document.getElementById('g_kupel').value) || 0;
                
                let days = 1;
                if (inDate && outDate) {
                    const diff = new Date(outDate) - new Date(inDate);
                    days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                }
                if (days < 1) days = 1;

                const total = (prices.domik * days) + (prices.banya * banya) + (prices.kupel * kupel);
                document.getElementById('g_total_price').textContent = `Итого: ${total} ₽`;
                return total;
            }

            document.getElementById('g_checkIn').onchange = updatePrice;
            document.getElementById('g_checkOut').onchange = updatePrice;

            // --- ОТПРАВКА ЗАКАЗА ---
            window.openBookingForm = function() {
                document.getElementById('bookingFormCard').classList.remove('hidden');
            }

            window.submitBooking = async function() {
                const name = document.getElementById('g_name').value;
                const phone = document.getElementById('g_phone').value;
                const date = document.getElementById('g_checkIn').value;
                const banya = document.getElementById('g_banya').value;
                const kupel = document.getElementById('g_kupel').value;
                
                if (!name || !phone || !date) { alert('Заполните имя, телефон и дату заезда!'); return; }

                const total = updatePrice();
                const newBooking = {
                    name: name, phone: phone, date: date,
                    adults: document.getElementById('g_adults').value,
                    children: document.getElementById('g_children').value,
                    banya: banya, kupel: kupel, total: total, blocked: false
                };
                
                try {
                    await addDoc(bookingsCollection, newBooking);
                    alert('Заявка отправлена! Мы свяжемся с вами.');
                    document.getElementById('bookingFormCard').classList.add('hidden');
                    document.getElementById('g_name').value = '';
                    document.getElementById('g_phone').value = '';
                } catch (error) { alert('Ошибка: ' + error.message); }
            }

            // --- БЛОКИРОВКА ДАТЫ (АДМИН) ---
            window.blockDate = async function() {
                const date = document.getElementById('block_date').value;
                if (!date) return;
                try {
                    await addDoc(bookingsCollection, { date: date, blocked: true });
                    document.getElementById('block_date').value = '';
                } catch (error) { alert('Ошибка: ' + error.message); }
            }

            // --- УДАЛЕНИЕ ---
            window.deleteBooking = async function(id) {
                if (confirm('Удалить запись?')) {
                    try { await deleteDoc(doc(db, "bookings", id)); } catch (error) { console.error(error); }
                }
            };
        });
    </script>
</body>
</html>
